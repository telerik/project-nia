name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - master
      - gh-pages-deploy
    paths:
      - "user-docs/**"
      - "book.toml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

env:
  # Checksums retrieved via: gh api repos/rust-lang/mdBook/releases/tags/v0.5.2 --jq '.assets[] | {name, digest}'
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_SHA256_LINUX: "084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          # Download mdBook with cryptographic verification for supply chain security
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          ARCHIVE="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"

          echo "Downloading mdBook v${MDBOOK_VERSION}..."
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${ARCHIVE}" -o "${ARCHIVE}"

          echo "Verifying SHA256 checksum..."
          echo "${MDBOOK_SHA256_LINUX}  ${ARCHIVE}" | sha256sum -c -

          echo "Installing mdBook..."
          tar -xzf "${ARCHIVE}" -C "$HOME/.local/bin"
          rm "${ARCHIVE}"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version
          echo "✓ mdBook installed and verified successfully"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build docs
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user-docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
